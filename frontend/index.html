<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Risk Assessment Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Heart Risk Assessment Tool</h1>
            <p>
                Estimate cardiovascular risk using a machine learning model trained on clinical heart disease data.
            </p>
            <small>
                Educational use only. Not a medical diagnosis.
            </small>
        </header>

        <section class="form-card">
            <form id="riskForm">

                <h2>Personal Information</h2>

                <label for="age">Age</label>
                <input type="number" id="age" required>

                <label for="sex">Gender</label>
                <select id="sex" required>
                    <option value="">Select</option>
                    <option value="1">Male</option>
                    <option value="0">Female</option>
                </select>

                <h2>Clinical Details</h2>

                <label for="cp">Chest discomfort type (cp)</label>
                <select id="cp" required>
                    <option value="">Select</option>
                    <option value="1">Typical angina</option>
                    <option value="2">Atypical angina</option>
                    <option value="3">Non-anginal pain</option>
                    <option value="4">Asymptomatic</option>
                </select>

                <label for="trestbps">Resting blood pressure</label>
                <input type="number" id="trestbps" required>

                <label for="chol">Cholesterol level</label>
                <input type="number" id="chol" required>

                <label for="fbs">High fasting blood sugar? (fbs)</label>
                <select id="fbs" required>
                    <option value="">Select</option>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>

                <label for="restecg">ECG result (restecg)</label>
                <select id="restecg" required>
                    <option value="">Select</option>
                    <option value="0">Normal</option>
                    <option value="1">ST-T wave abnormality</option>
                    <option value="2">Left ventricular hypertrophy</option>
                </select>

                <label for="thalach">Maximum heart rate achieved</label>
                <input type="number" id="thalach" required>

                <label for="exang">Exercise-induced chest pain? (exang)</label>
                <select id="exang" required>
                    <option value="">Select</option>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>

                <label for="oldpeak">Stress test abnormality score (oldpeak)</label>
                <input type="number" step="0.1" id="oldpeak" required>

                <label for="slope">ST segment slope (slope)</label>
                <select id="slope" required>
                    <option value="">Select</option>
                    <option value="1">Upsloping</option>
                    <option value="2">Flat</option>
                    <option value="3">Downsloping</option>
                </select>

                <label for="ca">Number of major vessels (ca)</label>
                <select id="ca" required>
                    <option value="">Select</option>
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>

                <label for="thal">Thalassemia test result (thal)</label>
                <select id="thal" required>
                    <option value="">Select</option>
                    <option value="3">Normal</option>
                    <option value="6">Fixed defect</option>
                    <option value="7">Reversible defect</option>
                </select>

                <button type="submit">Assess Risk</button>

            </form>
        </section>

        <section class="result-card" id="resultCard">
            <h2>Prediction Result</h2>
            <p id="predictionText">Your result will appear here.</p>
            <p id="probabilityText"></p>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
